# Spike 3 only. Same compiler settings as contracts/.
[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["dependencies"]
auto_detect_remappings = false
solc_version = "0.8.37"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
use_literal_content = true

[fuzz]
runs = 256

[profile.ci.fuzz]
runs = 5000

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"

[soldeer]
remappings_generate = true
remappings_regenerate = false
remappings_version = false
remappings_location = "txt"

[dependencies]
"@openzeppelin-contracts" = "5.7.0"
forge-std = "1.17.0"
