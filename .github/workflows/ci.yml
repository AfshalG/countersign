name: CI

on:
  push:
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      # The Soldeer registry has outages (HTTP 520/522 on 6 Oct 2026). Cache the
      # downloaded libraries by lock file, and retry the install when it does run.
      - uses: actions/cache@v6
        id: soldeer-contracts
        with:
          path: contracts/dependencies
          key: soldeer-contracts-${{ hashFiles('contracts/soldeer.lock') }}
      - name: Install Solidity dependencies
        if: steps.soldeer-contracts.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            forge soldeer install && exit 0
            echo "Soldeer install failed (attempt $attempt), retrying in $((attempt * 15)) s"
            sleep $((attempt * 15))
          done
          exit 1
      - run: forge fmt --check
      - run: forge build
      - run: forge test -vvv
      # The TypeScript ABIs in packages/chain must match what the contracts compile to.
      - name: ABIs are up to date
        run: |
          node ../packages/chain/scripts/generate-abis.mjs
          git diff --exit-code ../packages/chain/src/abis.ts

  # Kept separate from `contracts` so main's required check names never change.
  spike-01-passkey:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/01-passkey
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      # The Soldeer registry has outages (HTTP 520/522 on 6 Oct 2026). Cache the
      # downloaded libraries by lock file, and retry the install when it does run.
      - uses: actions/cache@v6
        id: soldeer-spike-01
        with:
          path: spikes/01-passkey/dependencies
          key: soldeer-spikes/01-passkey-${{ hashFiles('spikes/01-passkey/soldeer.lock') }}
      - name: Install Solidity dependencies
        if: steps.soldeer-spike-01.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            forge soldeer install && exit 0
            echo "Soldeer install failed (attempt $attempt), retrying in $((attempt * 15)) s"
            sleep $((attempt * 15))
          done
          exit 1
      - run: forge fmt --check
      - run: forge test -vv

  spike-02-primus:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/02-primus
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      # The Soldeer registry has outages (HTTP 520/522 on 6 Oct 2026). Cache the
      # downloaded libraries by lock file, and retry the install when it does run.
      - uses: actions/cache@v6
        id: soldeer-spike-02
        with:
          path: spikes/02-primus/dependencies
          key: soldeer-spikes/02-primus-${{ hashFiles('spikes/02-primus/soldeer.lock') }}
      - name: Install Solidity dependencies
        if: steps.soldeer-spike-02.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            forge soldeer install && exit 0
            echo "Soldeer install failed (attempt $attempt), retrying in $((attempt * 15)) s"
            sleep $((attempt * 15))
          done
          exit 1
      - run: forge fmt --check
      - run: forge test -vv

  spike-03-payments:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/03-payments
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      # The Soldeer registry has outages (HTTP 520/522 on 6 Oct 2026). Cache the
      # downloaded libraries by lock file, and retry the install when it does run.
      - uses: actions/cache@v6
        id: soldeer-spike-03
        with:
          path: spikes/03-payments/dependencies
          key: soldeer-spikes/03-payments-${{ hashFiles('spikes/03-payments/soldeer.lock') }}
      - name: Install Solidity dependencies
        if: steps.soldeer-spike-03.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            forge soldeer install && exit 0
            echo "Soldeer install failed (attempt $attempt), retrying in $((attempt * 15)) s"
            sleep $((attempt * 15))
          done
          exit 1
      - run: forge fmt --check
      - run: forge test -vv

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # No license needed: the repo belongs to a personal account.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
